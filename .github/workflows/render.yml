# Renderer-A — GitHub-hosted ephemeral render runner
# ---------------------------------------------------------------------------
# A GitHub-hosted runner is freshly provisioned, dynamically addressed and
# decommissioned after the job. This workflow therefore:
#   checkout -> install deps -> heartbeat/claim -> render available jobs
#   -> upload to R2 -> report completion -> exit (runner is torn down).
#
# The runner only ever makes OUTBOUND HTTPS calls to the Cloudflare API and
# R2 (plan §24). It never depends on an allowlisted/stable IP, and nothing
# permanent (videos, DB, credentials) is stored on the runner.
#
# All CHANNELRY_*_TOKEN / R2_* values below are read from GitHub Actions
# Secrets at runtime — they never appear in the repository.

name: Render queued Channelry jobs

on:
  workflow_dispatch:            # manual "Run workflow" button
  schedule:
    # Development/low-volume volume — poll the queue on an interval. Adjust
    # (or remove for purely manual dispatch) once volume grows.
    - cron: "*/10 * * * *"

jobs:
  render:
    name: Render character videos
    runs-on: ubuntu-latest
    timeout-minutes: 120     # never let an ephemeral runner be abused
    concurrency: 1            # one runner at a time per repo

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Pre-warm the RemBG model so the FIRST claimed job doesn't spend the
      # first minutes downloading u2net while a job is already marked busy.
      - name: Warm up background-removal model
        continue-on-error: true
        run: |
          python - <<'PY'
          from rembg import new_session
          new_session("u2net")
          print("rembg model ready")
          PY

      - name: Claim + render jobs
        env:
          CHANNELRY_CLOUD_API_URL: ${{ secrets.CHANNELRY_CLOUD_API_URL }}
          CHANNELRY_RENDER_WORKER_TOKEN: ${{ secrets.CHANNELRY_RENDER_WORKER_TOKEN }}
          # Ephemeral runner identity — unique per workflow run so the queue
          # sees a distinct renderer each time (never a shared/stale worker).
          CHANNELRY_RENDER_WORKER_ID: renderer-a-${{ github.run_id }}
          CHANNELRY_RENDER_WORKER_NAME: renderer-a-${{ github.run_id }}
          CHANNELRY_R2_ENDPOINT: ${{ secrets.CHANNELRY_R2_ENDPOINT }}
          CHANNELRY_R2_BUCKET: ${{ secrets.CHANNELRY_R2_BUCKET }}
          CHANNELRY_R2_ACCESS_KEY_ID: ${{ secrets.CHANNELRY_R2_ACCESS_KEY_ID }}
          CHANNELRY_R2_SECRET_ACCESS_KEY: ${{ secrets.CHANNELRY_R2_SECRET_ACCESS_KEY }}
          CHANNELRY_R2_PUBLIC_BASE_URL: ${{ secrets.CHANNELRY_R2_PUBLIC_BASE_URL }}
        run: |
          # Drain the queue FIFO (claim returns the OLDEST queued job first),
          # one after another until the queue is empty. max-jobs 1000 is
          # effectively "all of them" (a realistic cap well above volume); the
          # batch stops when the queue has been empty for 5 consecutive polls
          # (~15s) or the 45-minute max-seconds safety cap is hit. The Worker
          # dispatches this workflow the moment a job is queued (GITHUB_PAT
          # wake), so a freshly queued job starts rendering immediately, and
          # this run keeps going to drain whatever else is already queued.
          python -m renderer.main --max-jobs 1000 --max-seconds 2700 --max-empty 5
          echo "render batch finished"